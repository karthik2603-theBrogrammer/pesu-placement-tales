name: Bug report
description: Something on the site or in the code isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://pesu-placement-tales.vercel.app/...
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
